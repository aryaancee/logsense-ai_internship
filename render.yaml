services:
  - type: web
    name: logsense-ai
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: LOGSENSE_SECRET
        generateValue: true
      - key: LOGSENSE_PROVIDER
        value: openai
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LOGSENSE_MODEL
        value: openai/gpt-oss-120b
      - key: OPENAI_API_KEY
        sync: false
      - key: LOGSENSE_AUTHOR
        sync: false
