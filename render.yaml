# One-click deploy on Render: New > Blueprint > pick this repo. A persistent disk needs a paid plan (check Render's current plans).
services:
  - type: web
    name: logsense-ai
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: logsense-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: LOGSENSE_SECRET
        generateValue: true
      - key: LOGSENSE_PROVIDER
        value: openai
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LOGSENSE_MODEL
        value: openai/gpt-oss-120b
      - key: OPENAI_API_KEY
        sync: false
      - key: LOGSENSE_AUTHOR
        sync: false
